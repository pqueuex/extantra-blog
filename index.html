<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXTANTRA — Feed</title>
    <meta name="description" content="Unified media feed — tedwordnelson & nyquilcigarettes.">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <link rel="canonical" href="https://extantra.net">
    <link rel="icon" type="image/webp" href="images/extantralogo-inverted.webp">
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --accent: #cc0000;
            --accent-dark: #990000;
            --accent-darker: #aa0000;
            --accent-dim: #330000;
            --accent-hover: #440000;
            --accent-dimmer: #220000;
            --accent-glow: rgba(204, 0, 0, 0.3);
        }
        .user-label {
            display: inline-block;
            font-size: 9px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 1px 6px;
            border-radius: 0;
            margin-right: 6px;
        }
        .type-badge {
            font-size: 8px;
            padding: 1px 5px;
            border: 1px solid #444;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 4px;
        }
        .filter-bar {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .filter-bar button {
            background: transparent;
            border: 1px solid #333;
            color: #666;
            padding: 3px 10px;
            font-size: 9px;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.15s ease;
        }
        .filter-bar button:hover { border-color: #555; color: #aaa; }
        .filter-bar button.active { background: #333; border-color: #555; color: white; }
        .post-meta-row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
        .media-card-link { text-decoration: none; color: inherit; display: block; }
        .sidebar-user { cursor: pointer; padding: 6px 8px; font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; border-left: 2px solid transparent; transition: all 0.15s ease; }
        .sidebar-user:hover { border-left-color: #444; color: white; }
        .sidebar-section-label { font-size: 8px; color: #444; text-transform: uppercase; letter-spacing: 1px; padding: 8px 8px 4px; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo-space">
                <img src="images/extantralogo-inverted.webp" alt="EXTANTRA" class="logo-image">
            </div>
        </header>

        <div class="main-container">
            <aside class="sidebar">
                <div class="categories-section">
                    <div class="category active" onclick="setUserFilter('all')">Feed</div>
                    <div class="sidebar-section-label">Users</div>
                    <div id="userLinks"></div>
                </div>
            </aside>

            <main class="content">
                <div class="content-header">
                    <h1 id="feedTitle">Feed</h1>
                    <p class="tagline" id="feedSubtitle"> </p>
                </div>

                <div class="filter-bar" id="typeFilterBar">
                    <button class="active" data-type="all">All</button>
                    <button data-type="post">Posts</button>
                    <button data-type="photo">Photos</button>
                    <button data-type="audio">Music</button>
                    <button data-type="video">Video</button>
                    <button data-type="drawing">Drawings</button>
                    <button data-type="3d-model">3D Models</button>
                    <button data-type="travel">Travel</button>
                    <button data-type="music-video">Music Videos</button>
                </div>

                <div class="blog-grid" id="feedGrid">
                    <div style="text-align:center;padding:40px 20px;color:#666;">Loading feed…</div>
                </div>
            </main>
        </div>

        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2026 EXTANTRA. All rights reserved.</p>
                <div class="footer-links">
                    <a href="mailto:contact@extantra.net">Contact</a>
                    <a href="https://store.extantra.net">Store</a>
                </div>
            </div>
        </footer>
    </div>

    <script>
        let users = [];
        let allEntities = [];
        let activeUser = 'all';
        let activeType = 'all';

        // ── helpers ──────────────────────────────────────────────────────────
        function getEntityUrl(entity) {
            const base = `${entity.author}/`;
            if (entity.type === 'post')         return `${base}post.html?slug=${entity.slug}`;
            if (entity.type === 'photo')         return `${base}photos.html#${entity.id}`;
            if (entity.type === 'audio')         return `${base}music.html#${entity.id}`;
            if (entity.type === 'video')         return `${base}video.html#${entity.id}`;
            if (entity.type === 'drawing')       return `${base}drawings.html#${entity.id}`;
            if (entity.type === '3d-model')      return `${base}3d-models.html#${entity.id}`;
            if (entity.type === 'travel')        return `${base}travel.html#${entity.id}`;
            if (entity.type === 'music-video')   return `${base}music-videos.html#${entity.id}`;
            return `${base}index.html`;
        }

        function getUserColor(handle) {
            const u = users.find(u => u.handle === handle);
            return u ? u.color : '#666';
        }

        // ── rendering ────────────────────────────────────────────────────────
        function renderFeed() {
            const grid = document.getElementById('feedGrid');

            let entities = allEntities;
            if (activeUser !== 'all') entities = entities.filter(e => e.author === activeUser);
            if (activeType !== 'all') entities = entities.filter(e => e.type === activeType);

            if (entities.length === 0) {
                grid.innerHTML = '<div style="text-align:center;padding:40px 20px;color:#666;">No content yet.</div>';
                return;
            }

            grid.innerHTML = '';
            entities.forEach(entity => {
                const formattedDate = new Date(entity.date).toLocaleDateString('en-US', {
                    year: 'numeric', month: 'long', day: 'numeric'
                });
                const userColor = getUserColor(entity.author);
                const userDisplay = users.find(u => u.handle === entity.author);

                const card = document.createElement('article');
                card.className = 'blog-post-card';

                const thumb = entity.thumbnail
                    ? `<div style="margin-bottom:8px;"><img src="${entity.thumbnail}" style="width:100%;max-height:80px;object-fit:cover;" loading="lazy"></div>`
                    : '';

                card.innerHTML = `
                    <a class="media-card-link" href="${getEntityUrl(entity)}">
                        ${thumb}
                        <div class="post-meta-row">
                            <span class="user-label" style="background:${userColor};color:white;">${userDisplay ? userDisplay.displayName : entity.author}</span>
                            <span class="type-badge">${entity.type}</span>
                            <span class="post-date" style="margin:0;font-size:9px;color:#666;">${formattedDate}</span>
                        </div>
                        <h2 class="post-title">${entity.title}</h2>
                        ${entity.excerpt ? `<div class="post-excerpt">${entity.excerpt}</div>` : ''}
                        ${entity.tags && entity.tags.length > 0 ? `
                            <div class="post-tags">
                                ${entity.tags.filter(Boolean).map(t => `<span class="tag">${t}</span>`).join('')}
                            </div>` : ''}
                    </a>`;
                grid.appendChild(card);
            });
        }

        function buildUserSidebar() {
            const container = document.getElementById('userLinks');
            container.innerHTML = '';
            users.forEach(user => {
                const div = document.createElement('div');
                div.className = 'sidebar-user';
                div.style.borderLeftColor = activeUser === user.handle ? user.color : 'transparent';
                div.style.color = activeUser === user.handle ? user.color : '';
                div.textContent = user.displayName;
                div.onclick = () => {
                    window.location.href = `${user.handle}/index.html`;
                };
                container.appendChild(div);
            });
        }

        function setUserFilter(handle) {
            activeUser = handle;
            buildUserSidebar();
            renderFeed();
        }

        // ── data loading ─────────────────────────────────────────────────────
        async function loadFeed() {
            try {
                // Load users.json
                const usersRes = await fetch('./users.json');
                if (!usersRes.ok) throw new Error('Could not load users.json');
                users = await usersRes.json();

                // Build sidebar immediately with user list
                buildUserSidebar();

                // Fetch each user's media-database.json in parallel
                const dbPromises = users.map(async user => {
                    try {
                        const ts = new Date().getTime();
                        const res = await fetch(`./${user.handle}/media-database.json?v=${ts}`);
                        if (!res.ok) return [];
                        const db = await res.json();
                        return db.entities || [];
                    } catch (err) {
                        console.warn(`Could not load ${user.handle}/media-database.json:`, err);
                        return [];
                    }
                });

                const results = await Promise.all(dbPromises);
                allEntities = results.flat()
                    .filter(e => e.status === 'published')
                    .sort((a, b) => new Date(b.date) - new Date(a.date));

                renderFeed();
            } catch (err) {
                console.error(err);
                document.getElementById('feedGrid').innerHTML =
                    '<div style="text-align:center;padding:40px 20px;color:#666;">Could not load feed.</div>';
            }
        }

        // ── event listeners ───────────────────────────────────────────────────
        document.getElementById('typeFilterBar').addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (!btn) return;
            document.querySelectorAll('.filter-bar button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeType = btn.dataset.type;
            renderFeed();
        });

        document.addEventListener('DOMContentLoaded', loadFeed);
    </script>
</body>
</html>
