<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">

    <meta name="twitter:description" content="Personal blog featuring technology, gaming, and creative projects.">
    <meta name="twitter:image" content="https://extantra.net/images/extantralogo-inverted.webp">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://extantra.net">
    
    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="images/extantralogo-inverted.webp">
    
    <link rel="stylesheet" href="styles.css?v=1.2">
    
    <!-- Structured Data for Blog -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Blog",
      "name": "EXTANTRA Blog",
      "url": "https://extantra.net",
      "description": "Personal blog featuring creative projects",
      "author": {
        "@type": "Person",
        "name": "EXTANTRA"
      },
      "publisher": {
        "@type": "Person",
        "name": "EXTANTRA"
      }
    }
    </script>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo-space">
                <img src="images/extantralogo-inverted.webp" alt="Extantra" class="logo-image" id="logoImage">
            </div>
        </header>

        <div class="main-container">
            <aside class="sidebar">
                <div class="categories-section">
                    <div class="category" onclick="goToPage('index.html')">Home</div>
                    <div class="category" onclick="goToPage('photos.html')">Photos</div>
                    <div class="category" onclick="goToPage('3d-models.html')">3D Models</div>
                    <div class="category" onclick="goToPage('video.html')">Video</div>
                    <div class="category" onclick="goToPage('drawings.html')">Drawings</div>
                    <div class="category" onclick="goToPage('music.html')">Music</div>
                </div>
            </aside>

            <main class="content">
                <div class="content-header">
                    <h1>EXTANTRA</h1>
                    <p class="tagline">Framing disconnection, whatever</p>
                </div>

                <div class="blog-grid">
                    <!-- Blog posts will be loaded dynamically -->
                </div>
            </main>
        </div>

        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2025 EXTANTRA. All rights reserved.</p>
                <div class="footer-links">
                    <a href="mailto:contact@extantra.net">Contact</a>
                    <a href="https://store.extantra.net">Store</a>
                </div>
            </div>
        </footer>
    </div>

    <!-- Hidden Admin Interface -->
    <div id="adminModal" class="admin-modal hidden">
        <div class="admin-modal-content">
            <div class="admin-header">
                <h2>Create New Blog Post</h2>
                <button class="admin-close" onclick="closeAdmin()">&times;</button>
            </div>
            
            <form id="blogPostForm" class="blog-form">
                <div class="form-group">
                    <label for="postTitle">Title</label>
                    <input type="text" id="postTitle" name="title" required placeholder="Enter post title...">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="postDate">Date</label>
                        <input type="date" id="postDate" name="date" required>
                    </div>
                    <div class="form-group">
                        <label for="postStatus">Status</label>
                        <select id="postStatus" name="status">
                            <option value="draft">Draft</option>
                            <option value="published">Published</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="postTags">Tags</label>
                    <input type="text" id="postTags" name="tags" placeholder="Enter tags separated by commas...">
                    <small>Separate tags with commas (e.g., web development, javascript, tutorial)</small>
                </div>
                
                <div class="form-group">
                    <label for="postExcerpt">Excerpt</label>
                    <textarea id="postExcerpt" name="excerpt" rows="3" placeholder="Brief description of the post..."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="postContent">Content</label>
                    <textarea id="postContent" name="content" rows="12" required placeholder="Write your blog post content here...&#10;&#10;You can use basic HTML tags like:&#10;&lt;p&gt;Paragraph&lt;/p&gt;&#10;&lt;strong&gt;Bold text&lt;/strong&gt;&#10;&lt;em&gt;Italic text&lt;/em&gt;&#10;&lt;code&gt;Inline code&lt;/code&gt;&#10;&lt;pre&gt;Code blocks&lt;/pre&gt;&#10;&lt;a href='url'&gt;Links&lt;/a&gt;&#10;&lt;img src='path/to/image.jpg' alt='Description'&gt;"></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="saveDraft()">Save as Draft</button>
                    <button type="button" class="btn btn-primary" onclick="publishPost()">Publish Post</button>
                    <button type="button" class="btn btn-danger" onclick="clearForm()">Clear</button>
                </div>
            </form>
            
            <!-- Post Management Section -->
            <div class="post-management-section" style="margin-top: 30px; border-top: 1px solid #ddd; padding-top: 20px;">
                <h3>Manage Posts</h3>
                <div style="margin-bottom: 15px;">
                    <button type="button" class="btn btn-secondary" onclick="exportBlogDatabase()">📥 Export Database</button>
                    <button type="button" class="btn btn-info" onclick="checkLocalStorage()">🔍 Check for Lost Posts</button>
                </div>
                <div class="post-list" id="postList">
                    <!-- Posts will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Admin interface variables
        let logoClickCount = 0;
        let logoClickTimer = null;
        let blogDatabase = null;
        
        function goToPage(page) {
            window.location.href = page;
        }
        
        // Test function to manually load blog posts
        function testBlogLoad() {
            console.log('🔧 Manual test blog load triggered');
            const testPost = {
                id: 1,
                title: "Welcome to EXTANTRA",
                slug: "welcome-to-extantra",
                date: "2025-07-08",
                status: "published",
                tags: ["welcome", "introduction", "blog"],
                excerpt: "Welcome to my personal blog where I share thoughts on technology, creativity, and digital experiences.",
                author: "EXTANTRA"
            };
            console.log('🔧 Test post:', testPost);
            updateBlogGrid([testPost]);
        }
        
        // Logo click handler for admin access
        function handleLogoClick() {
            logoClickCount++;
            
            if (logoClickCount === 1) {
                logoClickTimer = setTimeout(() => {
                    logoClickCount = 0;
                }, 2000); // Reset after 2 seconds
            }
            
            if (logoClickCount === 3) {
                clearTimeout(logoClickTimer);
                logoClickCount = 0;
                openAdmin();
            }
        }
        
        // Admin interface functions
        function openAdmin() {
            const modal = document.getElementById('adminModal');
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            isAdminMode = true;
            
            // Set today's date as default
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('postDate').value = today;
            
            // Load blog database and update display
            loadBlogDatabase().then(() => {
                // Update blog grid to show edit buttons
                if (blogDatabase && blogDatabase.posts) {
                    updateBlogGrid(blogDatabase.posts);
                    populatePostList();
                }
                
                // Check for lost posts in localStorage
                checkLocalStorage();
            });
            
            // Reset form to new post mode
            clearForm();
        }
        
        function closeAdmin() {
            const modal = document.getElementById('adminModal');
            modal.classList.add('hidden');
            document.body.style.overflow = '';
            isAdminMode = false;
            currentEditingPost = null;
            
            // Update blog grid to hide edit buttons
            loadAndDisplayPosts();
            
            // Reset form
            clearForm();
        }
        
        async function loadBlogDatabase() {
            try {
                const response = await fetch('./blog-database.json');
                if (response.ok) {
                    blogDatabase = await response.json();
                } else {
                    // Initialize empty database if file doesn't exist
                    blogDatabase = {
                        generated: new Date().toISOString(),
                        total_posts: 0,
                        posts: []
                    };
                }
                return blogDatabase;
            } catch (error) {
                console.error('Error loading blog database:', error);
                blogDatabase = {
                    generated: new Date().toISOString(),
                    total_posts: 0,
                    posts: []
                };
                return blogDatabase;
            }
        }
        
        function generateSlug(title) {
            return title
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }
        
        function createBlogPost(formData, status = 'draft') {
            const now = new Date().toISOString();
            const title = formData.get('title');
            const tags = formData.get('tags') ? formData.get('tags').split(',').map(tag => tag.trim()) : [];
            
            const post = {
                id: (blogDatabase.posts.length > 0 ? Math.max(...blogDatabase.posts.map(p => p.id)) + 1 : 1),
                title: title,
                slug: generateSlug(title),
                date: formData.get('date'),
                created: now,
                modified: now,
                status: status,
                tags: tags,
                excerpt: formData.get('excerpt') || '',
                content: formData.get('content'),
                author: 'EXTANTRA',
                featured: false
            };
            
            return post;
        }
        
        function saveDraft() {
            const form = document.getElementById('blogPostForm');
            const formData = new FormData(form);
            
            if (!formData.get('title') || !formData.get('content')) {
                showAdminMessage('Please fill in at least the title and content.', 'error');
                return;
            }
            
            const post = createBlogPost(formData, 'draft');
            
            // Add to database
            blogDatabase.posts.unshift(post); // Add to beginning
            blogDatabase.total_posts = blogDatabase.posts.length;
            blogDatabase.generated = new Date().toISOString();
            
            // Save to local storage for persistence
            localStorage.setItem('blogDatabase', JSON.stringify(blogDatabase));
            
            showAdminMessage(`Draft "${post.title}" saved successfully!`, 'success');
            
            // Clear form
            setTimeout(() => {
                clearForm();
            }, 2000);
        }
        
        function publishPost() {
            const form = document.getElementById('blogPostForm');
            const formData = new FormData(form);
            
            if (!formData.get('title') || !formData.get('content')) {
                showAdminMessage('Please fill in at least the title and content.', 'error');
                return;
            }
            
            const post = createBlogPost(formData, 'published');
            
            // Add to database
            blogDatabase.posts.unshift(post); // Add to beginning
            blogDatabase.total_posts = blogDatabase.posts.length;
            blogDatabase.generated = new Date().toISOString();
            
            // Save to local storage for persistence
            localStorage.setItem('blogDatabase', JSON.stringify(blogDatabase));
            
            showAdminMessage(`Post "${post.title}" published successfully! 🎉\n\n⚠️ IMPORTANT: Click "Export Database" below and replace the server's blog-database.json file to make this post permanent.`, 'success');
            
            // Clear form and refresh page to show new post
            setTimeout(() => {
                clearForm();
                closeAdmin();
                location.reload();
            }, 5000); // Give more time to read the message
        }
        
        function clearForm() {
            document.getElementById('blogPostForm').reset();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('postDate').value = today;
            hideAdminMessage();
            
            // Reset editing state
            currentEditingPost = null;
            
            // Reset form header
            const formHeader = document.querySelector('#adminModal h2');
            formHeader.textContent = 'Create New Blog Post';
            
            // Reset buttons
            updateFormButtons();
            
            // Clear image preview
            const preview = document.getElementById('imagePreview');
            if (preview) {
                preview.innerHTML = '';
            }
        }
        
        function showAdminMessage(message, type = 'info') {
            const messageDiv = document.getElementById('adminMessage');
            messageDiv.textContent = message;
            messageDiv.className = `admin-message ${type}`;
            messageDiv.classList.remove('hidden');
            
            setTimeout(() => {
                hideAdminMessage();
            }, 5000);
        }
        
        function hideAdminMessage() {
            const messageDiv = document.getElementById('adminMessage');
            messageDiv.classList.add('hidden');
        }
        
        // Image handling functions
        function handleImageUpload(event) {
            const files = event.target.files;
            const preview = document.getElementById('imagePreview');
            const contentTextarea = document.getElementById('postContent');
            
            preview.innerHTML = '';
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const imageUrl = e.target.result;
                        const fileName = file.name;
                        
                        // Create preview
                        const previewItem = document.createElement('div');
                        previewItem.className = 'image-preview-item';
                        previewItem.innerHTML = `
                            <img src="${imageUrl}" alt="${fileName}" style="max-width: 150px; max-height: 150px; object-fit: cover;">
                            <div class="image-actions">
                                <span class="image-filename">${fileName}</span>
                                <button type="button" onclick="insertImageTag('${fileName}')" class="btn btn-small">Insert</button>
                                <button type="button" onclick="copyImageTag('${fileName}')" class="btn btn-small">Copy HTML</button>
                            </div>
                        `;
                        preview.appendChild(previewItem);
                        
                        // Store the image data for later use
                        previewItem.dataset.imageData = imageUrl;
                        previewItem.dataset.fileName = fileName;
                    };
                    reader.readAsDataURL(file);
                }
            }
        }
        
        function insertImageTag(fileName) {
            const contentTextarea = document.getElementById('postContent');
            const imageTag = `<img src="images/${fileName}" alt="${fileName.replace(/\.[^/.]+$/, '')}" class="blog-image">`;
            
            // Insert at cursor position
            const startPos = contentTextarea.selectionStart;
            const endPos = contentTextarea.selectionEnd;
            const textBefore = contentTextarea.value.substring(0, startPos);
            const textAfter = contentTextarea.value.substring(endPos);
            
            contentTextarea.value = textBefore + imageTag + textAfter;
            
            // Position cursor after inserted tag
            contentTextarea.selectionStart = contentTextarea.selectionEnd = startPos + imageTag.length;
            contentTextarea.focus();
            
            showAdminMessage(`Image tag for "${fileName}" inserted into content!`, 'success');
        }
        
        function copyImageTag(fileName) {
            const imageTag = `<img src="images/${fileName}" alt="${fileName.replace(/\.[^/.]+$/, '')}" class="blog-image">`;
            
            // Copy to clipboard
            navigator.clipboard.writeText(imageTag).then(() => {
                showAdminMessage(`Image tag for "${fileName}" copied to clipboard!`, 'success');
            }).catch(() => {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = imageTag;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showAdminMessage(`Image tag for "${fileName}" copied to clipboard!`, 'success');
            });
        }
        
        function downloadImages() {
            const previewItems = document.querySelectorAll('.image-preview-item');
            const instructions = [];
            
            previewItems.forEach(item => {
                const fileName = item.dataset.fileName;
                const imageData = item.dataset.imageData;
                
                // Create download link
                const link = document.createElement('a');
                link.href = imageData;
                link.download = fileName;
                link.style.display = 'none';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                instructions.push(`• Save "${fileName}" to the images/ folder`);
            });
            
            if (instructions.length > 0) {
                const instructionText = `Images downloaded! Please:\n\n${instructions.join('\n')}\n\nThen your blog post images will display correctly.`;
                showAdminMessage(instructionText, 'info');
            }
        }
        
        function populatePostList() {
            const postList = document.getElementById('postList');
            if (!postList || !blogDatabase || !blogDatabase.posts) {
                return;
            }
            
            if (blogDatabase.posts.length === 0) {
                postList.innerHTML = '<p style="color: #666; font-style: italic;">No posts created yet.</p>';
                return;
            }
            
            const postsHtml = blogDatabase.posts.map(post => {
                const formattedDate = new Date(post.date).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
                
                const statusBadge = post.status === 'published' 
                    ? '<span class="status-badge status-published">Published</span>'
                    : '<span class="status-badge status-draft">Draft</span>';
                
                return `
                    <div class="post-item">
                        <div class="post-item-header">
                            <h4>${post.title}</h4>
                            ${statusBadge}
                        </div>
                        <div class="post-item-meta">
                            <span>ID: ${post.id}</span>
                            <span>Date: ${formattedDate}</span>
                            <span>Modified: ${new Date(post.modified).toLocaleDateString()}</span>
                        </div>
                        <div class="post-item-actions">
                            <button class="btn btn-small" onclick="editPost(${post.id})">Edit</button>
                            <button class="btn btn-small" onclick="quickAddImage(${post.id})" title="Quick add images">📷 Add Images</button>
                            <button class="btn btn-small btn-danger" onclick="deletePost(${post.id})">Delete</button>
                            ${post.status === 'draft' ? `<button class="btn btn-small btn-primary" onclick="publishExistingPost(${post.id})">Publish</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
            
            postList.innerHTML = postsHtml;
        }
        
        function deletePost(postId) {
            if (!confirm('Are you sure you want to delete this post? This action cannot be undone.')) {
                return;
            }
            
            const postIndex = blogDatabase.posts.findIndex(p => p.id === postId);
            if (postIndex === -1) {
                showAdminMessage('Post not found!', 'error');
                return;
            }
            
            const post = blogDatabase.posts[postIndex];
            blogDatabase.posts.splice(postIndex, 1);
            blogDatabase.total_posts = blogDatabase.posts.length;
            blogDatabase.generated = new Date().toISOString();
            
            // Save to local storage
            localStorage.setItem('blogDatabase', JSON.stringify(blogDatabase));
            
            showAdminMessage(`Post "${post.title}" deleted successfully!`, 'success');
            
            // Refresh displays
            populatePostList();
            loadAndDisplayPosts();
        }
        
        function publishExistingPost(postId) {
            const postIndex = blogDatabase.posts.findIndex(p => p.id === postId);
            if (postIndex === -1) {
                showAdminMessage('Post not found!', 'error');
                return;
            }
            
            blogDatabase.posts[postIndex].status = 'published';
            blogDatabase.posts[postIndex].modified = new Date().toISOString();
            blogDatabase.generated = new Date().toISOString();
            
            // Save to local storage
            localStorage.setItem('blogDatabase', JSON.stringify(blogDatabase));
            
            showAdminMessage(`Post "${blogDatabase.posts[postIndex].title}" published successfully!`, 'success');
            
            // Refresh displays
            populatePostList();
            loadAndDisplayPosts();
        }
        
        // Quick image addition function
        function quickAddImage(postId) {
            // Open file picker for image
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.multiple = true;
            
            input.onchange = function(event) {
                const files = event.target.files;
                if (files.length === 0) return;
                
                const post = blogDatabase.posts.find(p => p.id === postId);
                if (!post) {
                    showAdminMessage('Post not found!', 'error');
                    return;
                }
                
                // Generate image tags for the files
                const imageTags = [];
                let processed = 0;
                
                for (let file of files) {
                    if (file.type.startsWith('image/')) {
                        const fileName = file.name;
                        const imageTag = `<img src="images/${fileName}" alt="${fileName.replace(/\.[^/.]+$/, '')}" class="blog-image">`;
                        imageTags.push(imageTag);
                        
                        // Create a download for the file
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const link = document.createElement('a');
                            link.href = e.target.result;
                            link.download = fileName;
                            link.style.display = 'none';
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                        };
                        reader.readAsDataURL(file);
                    }
                    processed++;
                }
                
                if (imageTags.length > 0) {
                    // Add image tags to post content
                    const imageHtml = '\n\n' + imageTags.join('\n') + '\n\n';
                    post.content += imageHtml;
                    post.modified = new Date().toISOString();
                    
                    // Save to database
                    blogDatabase.generated = new Date().toISOString();
                    localStorage.setItem('blogDatabase', JSON.stringify(blogDatabase));
                    
                    showAdminMessage(`Added ${imageTags.length} image(s) to "${post.title}". Remember to save the downloaded images to the images/ folder.`, 'success');
                    
                    // Offer to edit the post
                    setTimeout(() => {
                        if (confirm('Would you like to edit the post to adjust the image placement?')) {
                            editPost(postId);
                        }
                    }, 2000);
                }
            };
            
            input.click();
        }

        // ...existing code...
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            console.log('EXTANTRA Blog loaded');
            console.log('🔍 Debug: Checking for cached data...');
            console.log('🔍 Current protocol:', window.location.protocol);
            console.log('🔍 Current URL:', window.location.href);
            
            // Clear any cached blog data to ensure fresh start
            const savedDatabase = localStorage.getItem('blogDatabase');
            if (savedDatabase) {
                console.log('🔍 Found cached blog data, checking if it should be cleared...');
                try {
                    const parsedDatabase = JSON.parse(savedDatabase);
                    console.log('🔍 Cached posts count:', parsedDatabase.posts.length);
                    
                    // Clear localStorage to ensure fresh start
                    localStorage.removeItem('blogDatabase');
                    console.log('🔍 Cleared localStorage blog data for fresh start');
                } catch (error) {
                    console.error('Error parsing saved blog database:', error);
                    localStorage.removeItem('blogDatabase');
                }
            }
            
            // Load fresh blog database from server
            loadFreshBlogDatabase();
            
            // Add logo click handler
            const logoImage = document.getElementById('logoImage');
            logoImage.addEventListener('click', handleLogoClick);
            
            // Close admin modal on Escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeAdmin();
                }
            });
            
            // Fallback: if running on file:// protocol, load test post
            if (window.location.protocol === 'file:') {
                console.log('🔍 Running on file:// protocol, loading fallback post...');
                setTimeout(() => {
                    const testPost = {
                        id: 1,
                        title: "Welcome to EXTANTRA",
                        slug: "welcome-to-extantra",
                        date: "2025-07-08",
                        status: "published",
                        tags: ["welcome", "introduction", "blog"],
                        excerpt: "Welcome to my personal blog where I share thoughts on technology, creativity, and digital experiences.",
                        author: "EXTANTRA"
                    };
                    console.log('🔍 Loading fallback post:', testPost);
                    updateBlogGrid([testPost]);
                }, 1000);
            }
        });
        
        async function loadFreshBlogDatabase() {
            console.log('🔍 Loading fresh blog database from server...');
            try {
                // Add cache-busting parameter to ensure fresh data
                const timestamp = new Date().getTime();
                const url = `./blog-database.json?v=${timestamp}`;
                console.log('🔍 Fetching from URL:', url);
                
                const response = await fetch(url);
                console.log('🔍 Response status:', response.status, response.statusText);
                
                if (response.ok) {
                    const freshDatabase = await response.json();
                    console.log('🔍 Fresh database loaded. Posts count:', freshDatabase.posts.length);
                    console.log('🔍 Database content:', freshDatabase);
                    updateBlogGrid(freshDatabase.posts);
                } else {
                    console.log('🔍 No blog database found on server, starting fresh');
                    updateBlogGrid([]);
                }
            } catch (error) {
                console.error('🔍 Error loading fresh blog database:', error);
                updateBlogGrid([]);
            }
        }
        
        let isAdminMode = false;
        let currentEditingPost = null;
        
        function updateBlogGrid(posts) {
            console.log('🔍 updateBlogGrid called with posts:', posts);
            const blogGrid = document.querySelector('.blog-grid');
            if (!blogGrid) {
                console.error('🔍 Blog grid element not found!');
                return;
            }
            
            console.log('🔍 Blog grid element found');
            
            // Clear existing posts
            blogGrid.innerHTML = '';
            
            // Filter for published posts
            const publishedPosts = posts.filter(post => post.status === 'published');
            console.log('🔍 Published posts:', publishedPosts.length, publishedPosts);
            
            if (publishedPosts.length === 0) {
                console.log('🔍 No published posts found, showing empty state');
                // Show empty state message
                blogGrid.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; color: #666;">
                        <p>No blog posts yet. Check back soon!</p>
                        <p style="font-size: 10px; color: #999;">Debug: Found ${posts.length} total posts, ${publishedPosts.length} published</p>
                    </div>
                `;
                return;
            }
            
            console.log('🔍 Rendering', publishedPosts.length, 'published posts');
            
            // Add published posts
            publishedPosts.forEach((post, index) => {
                console.log(`🔍 Rendering post ${index + 1}:`, post.title);
                const article = document.createElement('article');
                article.className = 'blog-post-card';
                article.style.cursor = 'pointer';
                article.style.position = 'relative';
                
                const formattedDate = new Date(post.date).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                
                article.innerHTML = `
                    <div class="post-date">${formattedDate}</div>
                    <h2 class="post-title">${post.title}</h2>
                    <div class="post-excerpt">${post.excerpt}</div>
                    <div class="post-tags">
                        ${post.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                    ${isAdminMode ? `<button class="edit-post-btn" onclick="editPost(${post.id}); event.stopPropagation();" title="Edit Post">✏️</button>` : ''}
                `;
                
                // Add click handler to navigate to individual post
                article.addEventListener('click', () => {
                    console.log('🔍 Clicked post:', post.title, 'slug:', post.slug);
                    window.location.href = `post.html?slug=${post.slug}`;
                });
                
                blogGrid.appendChild(article);
                console.log('🔍 Post added to grid:', post.title);
            });
            
            console.log('🔍 All posts rendered successfully');
        }
        
        function editPost(postId) {
            const post = blogDatabase.posts.find(p => p.id === postId);
            if (!post) {
                showAdminMessage('Post not found!', 'error');
                return;
            }
            
            currentEditingPost = post;
            
            // Fill form with post data
            document.getElementById('postTitle').value = post.title;
            document.getElementById('postDate').value = post.date;
            document.getElementById('postTags').value = post.tags.join(', ');
            document.getElementById('postExcerpt').value = post.excerpt;
            document.getElementById('postContent').value = post.content;
            
            // Update form header
            const formHeader = document.querySelector('#adminModal h2');
            formHeader.textContent = `Edit Post: ${post.title}`;
            
            // Show/hide appropriate buttons
            updateFormButtons();
            
            showAdminMessage(`Editing post: "${post.title}"`, 'info');
        }
        
        function updatePost() {
            if (!currentEditingPost) {
                showAdminMessage('No post selected for editing!', 'error');
                return;
            }
            
            const form = document.getElementById('blogPostForm');
            const formData = new FormData(form);
            
            if (!formData.get('title') || !formData.get('content')) {
                showAdminMessage('Please fill in at least the title and content.', 'error');
                return;
            }
            
            // Find and update the post
            const postIndex = blogDatabase.posts.findIndex(p => p.id === currentEditingPost.id);
            if (postIndex === -1) {
                showAdminMessage('Post not found in database!', 'error');
                return;
            }
            
            // Update post data
            const updatedPost = {
                ...currentEditingPost,
                title: formData.get('title'),
                slug: generateSlug(formData.get('title')),
                date: formData.get('date'),
                modified: new Date().toISOString(),
                tags: formData.get('tags') ? formData.get('tags').split(',').map(tag => tag.trim()) : [],
                excerpt: formData.get('excerpt') || '',
                content: formData.get('content')
            };
            
            blogDatabase.posts[postIndex] = updatedPost;
            blogDatabase.generated = new Date().toISOString();
            
            // Save to local storage for persistence
            localStorage.setItem('blogDatabase', JSON.stringify(blogDatabase));
            
            showAdminMessage(`Post "${updatedPost.title}" updated successfully!`, 'success');
            
            // Clear form and refresh
            setTimeout(() => {
                clearForm();
                closeAdmin();
                location.reload();
            }, 2000);
        }
        
        function clearPost(postId) {
            const postIndex = blogDatabase.posts.findIndex(p => p.id === postId);
            if (postIndex === -1) {
                showAdminMessage('Post not found!', 'error');
                return;
            }
            
            // Remove from database
            blogDatabase.posts.splice(postIndex, 1);
            blogDatabase.total_posts = blogDatabase.posts.length;
            blogDatabase.generated = new Date().toISOString();
            
            // Save to local storage for persistence
            localStorage.setItem('blogDatabase', JSON.stringify(blogDatabase));
            
            showAdminMessage('Post deleted successfully!', 'success');
            
            // Refresh post list
            loadAndDisplayPosts();
        }
        
        function updateFormButtons() {
            const formActions = document.querySelector('.form-actions');
            
            if (currentEditingPost) {
                // Show update button, hide save draft and publish
                formActions.innerHTML = `
                    <button type="button" class="btn btn-primary" onclick="updatePost()">Update Post</button>
                    <button type="button" class="btn btn-secondary" onclick="cancelEdit()">Cancel</button>
                    <button type="button" class="btn btn-danger" onclick="clearForm()">Clear</button>
                `;
            } else {
                // Show normal buttons
                formActions.innerHTML = `
                    <button type="button" class="btn btn-secondary" onclick="saveDraft()">Save Draft</button>
                    <button type="button" class="btn btn-primary" onclick="publishPost()">Publish</button>
                    <button type="button" class="btn btn-danger" onclick="clearForm()">Clear</button>
                `;
            }
        }
        
        function cancelEdit() {
            currentEditingPost = null;
            clearForm();
            
            // Reset form header
            const formHeader = document.querySelector('#adminModal h2');
            formHeader.textContent = 'Create New Blog Post';
            
            // Reset buttons
            updateFormButtons();
            
            showAdminMessage('Edit cancelled', 'info');
        }
        
        function loadAndDisplayPosts() {
            // Load posts and update the display
            if (typeof blogDatabase !== 'undefined' && blogDatabase.posts) {
                updateBlogGrid(blogDatabase.posts);
            } else {
                // Try to load from storage or fetch
                loadBlogDatabase().then(() => {
                    if (blogDatabase && blogDatabase.posts) {
                        updateBlogGrid(blogDatabase.posts);
                    }
                });
            }
        }
        
        function exportBlogDatabase() {
            if (!blogDatabase) {
                showAdminMessage('No blog database loaded', 'error');
                return;
            }
            
            const dataStr = JSON.stringify(blogDatabase, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(dataBlob);
            link.download = 'blog-database.json';
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showAdminMessage('Blog database exported successfully!', 'success');
        }
        
        function checkLocalStorage() {
            const savedDatabase = localStorage.getItem('blogDatabase');
            if (savedDatabase) {
                try {
                    const localDB = JSON.parse(savedDatabase);
                    const localPostCount = localDB.posts ? localDB.posts.length : 0;
                    const serverPostCount = blogDatabase.posts ? blogDatabase.posts.length : 0;
                    
                    if (localPostCount > serverPostCount) {
                        const lostPosts = localPostCount - serverPostCount;
                        showAdminMessage(`⚠️ Found ${lostPosts} posts in browser storage that aren't on the server! Click "Recover Lost Posts" to restore them.`, 'warning');
                        
                        // Add recover button to form actions
                        const formActions = document.querySelector('.form-actions');
                        if (!document.getElementById('recoverBtn')) {
                            const recoverBtn = document.createElement('button');
                            recoverBtn.id = 'recoverBtn';
                            recoverBtn.type = 'button';
                            recoverBtn.className = 'btn btn-warning';
                            recoverBtn.onclick = recoverLostPosts;
                            recoverBtn.textContent = 'Recover Lost Posts';
                            formActions.appendChild(recoverBtn);
                        }
                    }
                    
                    return localDB;
                } catch (error) {
                    console.error('Error parsing localStorage database:', error);
                }
            }
            return null;
        }
        
        function recoverLostPosts() {
            const savedDatabase = localStorage.getItem('blogDatabase');
            if (!savedDatabase) {
                showAdminMessage('No posts found in browser storage', 'error');
                return;
            }
            
            try {
                const localDB = JSON.parse(savedDatabase);
                const currentIds = new Set(blogDatabase.posts.map(p => p.id));
                const lostPosts = localDB.posts.filter(p => !currentIds.has(p.id));
                
                if (lostPosts.length === 0) {
                    showAdminMessage('No lost posts found', 'info');
                    return;
                }
                
                // Add lost posts to current database
                blogDatabase.posts.unshift(...lostPosts);
                blogDatabase.total_posts = blogDatabase.posts.length;
                blogDatabase.generated = new Date().toISOString();
                
                // Update localStorage with merged data
                localStorage.setItem('blogDatabase', JSON.stringify(blogDatabase));
                
                showAdminMessage(`Recovered ${lostPosts.length} posts! Click "Export Database" to save them to a file.`, 'success');
                
                // Refresh displays
                populatePostList();
                loadAndDisplayPosts();
                
                // Remove recover button
                const recoverBtn = document.getElementById('recoverBtn');
                if (recoverBtn) {
                    recoverBtn.remove();
                }
                
            } catch (error) {
                console.error('Error recovering posts:', error);
                showAdminMessage('Error recovering posts', 'error');
            }
        }
    </script>
</body>
</html>
