<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags (will be dynamically updated) -->
    <title>Loading... - EXTANTRA</title>
    <meta name="description" content="Blog post by EXTANTRA">
    <meta name="keywords" content="blog, EXTANTRA">
    <meta name="author" content="EXTANTRA">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    
    <!-- Open Graph Meta Tags (will be dynamically updated) -->
    <meta property="og:title" content="Loading... - EXTANTRA">
    <meta property="og:description" content="Blog post by EXTANTRA">
    <meta property="og:type" content="article">
    <meta property="og:url" content="">
    <meta property="og:image" content="https://extantra.net/images/extantralogo-inverted.webp">
    <meta property="og:site_name" content="EXTANTRA Blog">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Loading... - EXTANTRA">
    <meta name="twitter:description" content="Blog post by EXTANTRA">
    <meta name="twitter:image" content="https://extantra.net/images/extantralogo-inverted.webp">
    
    <!-- Canonical URL (will be dynamically updated) -->
    <link rel="canonical" href="">
    
    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="images/extantralogo-inverted.webp">
    
    <link rel="stylesheet" href="styles.css?v=1.3">
    
    <style>
        /* Additional styles for individual blog post */
        .post-content {
            margin-top: 20px;
            line-height: 1.6;
        }
        
        .post-content p {
            margin-bottom: 16px;
            color: #cccccc;
            font-size: 12px;
        }
        
        .post-content h2 {
            color: #cc0000;
            font-size: 16px;
            margin: 24px 0 12px 0;
            border-bottom: 1px solid #cc0000;
            padding-bottom: 4px;
        }
        
        .post-content h3 {
            color: #cc0000;
            font-size: 14px;
            margin: 20px 0 10px 0;
        }
        
        .post-content h4 {
            color: white;
            font-size: 12px;
            margin: 16px 0 8px 0;
        }
        
        .post-content code {
            background-color: #333;
            color: #cc0000;
            padding: 2px 4px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }
        
        .post-content pre {
            background-color: #111;
            border: 1px solid #333;
            padding: 12px;
            overflow-x: auto;
            margin: 16px 0;
        }
        
        .post-content pre code {
            background: none;
            padding: 0;
            color: #ccc;
        }
        
        .post-content blockquote {
            border-left: 3px solid #cc0000;
            padding-left: 16px;
            margin: 16px 0;
            font-style: italic;
            color: #999;
        }
        
        .post-content a {
            color: #cc0000;
            text-decoration: none;
        }
        
        .post-content a:hover {
            text-decoration: underline;
        }
        
        .post-content ul, .post-content ol {
            margin: 16px 0 16px 20px;
            color: #cccccc;
        }
        
        .post-content li {
            margin-bottom: 8px;
            font-size: 12px;
        }
        
        .post-header {
            border-bottom: 1px solid #cc0000;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        
        .post-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 12px;
            font-size: 10px;
            color: #666;
        }
        
        .post-meta .author {
            color: #cc0000;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #cc0000;
            text-decoration: none;
            font-size: 12px;
            border: 1px solid #cc0000;
            padding: 6px 12px;
            transition: all 0.2s ease;
        }
        
        .back-link:hover {
            background-color: #cc0000;
            color: white;
        }
        
        .error-message {
            text-align: center;
            padding: 40px 20px;
            color: #cc0000;
        }
        
        .loading-message {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo-space">
                <img src="images/extantralogo-inverted.webp" alt="EXTANTRA Logo" class="logo-image">
            </div>
        </header>

        <div class="main-container">
            <aside class="sidebar">
                <div class="categories-section">
                    <div class="category" onclick="goToPage('index.html')">Home</div>
                    <div class="category" onclick="goToPage('photos.html')">Photos</div>
                    <div class="category" onclick="goToPage('3d-models.html')">3D Models</div>
                    <div class="category" onclick="goToPage('video.html')">Video</div>
                    <div class="category" onclick="goToPage('drawings.html')">Drawings</div>
                    <div class="category" onclick="goToPage('music.html')">Music</div>
                </div>
            </aside>

            <main class="content">
                <a href="index.html" class="back-link">← Back to Blog</a>
                
                <div id="postContainer">
                    <div class="loading-message">Loading post...</div>
                </div>
            </main>
        </div>

        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2026 EXTANTRA. All rights reserved.</p>
                <div class="footer-links">
                    <a href="mailto:contact@extantra.net">Contact</a>
                    <a href="https://store.extantra.net">Store</a>
                </div>
            </div>
        </footer>
    </div>

    <script>
        function goToPage(page) {
            window.location.href = page;
        }
        
        // Get the slug from URL parameters
        function getSlugFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('slug');
        }
        
        // Update page metadata
        function updatePageMeta(post) {
            // Update title
            document.title = `${post.title} - EXTANTRA`;
            
            // Update meta description
            const description = post.excerpt || post.content.substring(0, 150) + '...';
            document.querySelector('meta[name="description"]').content = description;
            
            // Update keywords
            const keywords = `blog, EXTANTRA, ${post.tags.join(', ')}`;
            document.querySelector('meta[name="keywords"]').content = keywords;
            
            // Update Open Graph tags
            document.querySelector('meta[property="og:title"]').content = `${post.title} - EXTANTRA`;
            document.querySelector('meta[property="og:description"]').content = description;
            document.querySelector('meta[property="og:url"]').content = window.location.href;
            
            // Update Twitter Card tags
            document.querySelector('meta[name="twitter:title"]').content = `${post.title} - EXTANTRA`;
            document.querySelector('meta[name="twitter:description"]').content = description;
            
            // Update canonical URL
            document.querySelector('link[rel="canonical"]').href = window.location.href;
        }
        
        // Render the blog post
        function renderPost(post) {
            const container = document.getElementById('postContainer');
            
            const formattedDate = new Date(post.date).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            
            container.innerHTML = `
                <article class="blog-post">
                    <div class="post-header">
                        <h1 class="post-title">${post.title}</h1>
                        <div class="post-meta">
                            <span class="date">${formattedDate}</span>
                            <span class="author">by ${post.author}</span>
                            ${post.tags.length > 0 ? `
                                <div class="post-tags">
                                    ${post.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                    <div class="post-content">
                        ${post.content}
                    </div>
                </article>
            `;
        }
        
        // Load and display the blog post
        async function loadPost() {
            const slug = getSlugFromUrl();
            
            if (!slug) {
                document.getElementById('postContainer').innerHTML = `
                    <div class="error-message">
                        <h2>Post not found</h2>
                        <p>No post specified. <a href="index.html">Return to blog</a></p>
                    </div>
                `;
                return;
            }
            
            try {
                // Load blog database
                const timestamp = new Date().getTime();
                const response = await fetch(`./blog-database.json?v=${timestamp}`);
                
                if (!response.ok) {
                    throw new Error('Could not load blog database');
                }
                
                const database = await response.json();
                
                // Find the post by slug
                const post = database.posts.find(p => p.slug === slug && p.status === 'published');
                
                if (!post) {
                    document.getElementById('postContainer').innerHTML = `
                        <div class="error-message">
                            <h2>Post not found</h2>
                            <p>The requested post could not be found. <a href="index.html">Return to blog</a></p>
                        </div>
                    `;
                    return;
                }
                
                // Update page metadata
                updatePageMeta(post);
                
                // Render the post
                renderPost(post);
                
            } catch (error) {
                console.error('Error loading post:', error);
                document.getElementById('postContainer').innerHTML = `
                    <div class="error-message">
                        <h2>Error loading post</h2>
                        <p>There was an error loading the post. <a href="index.html">Return to blog</a></p>
                    </div>
                `;
            }
        }
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Individual blog post page loaded');
            loadPost();
        });
    </script>
</body>
</html>
