<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nyquilcigarettes</title>
    <meta name="description" content="Personal media hub of nyquilcigarettes.">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <link rel="icon" type="image/webp" href="../images/extantralogo-inverted.webp">
    <link rel="stylesheet" href="../styles.css">
    <style>
        :root {
            --accent: #1a3a8a;
            --accent-dark: #0d1a50;
            --accent-darker: #102266;
            --accent-dim: #071130;
            --accent-hover: #0f1f45;
            --accent-dimmer: #050b1c;
            --accent-glow: rgba(26, 58, 138, 0.3);
        }
        .type-badge {
            font-size: 8px;
            padding: 1px 5px;
            border: 1px solid var(--accent);
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 6px;
        }
        .filter-bar {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .filter-bar button {
            background: transparent;
            border: 1px solid #333;
            color: #666;
            padding: 3px 10px;
            font-size: 9px;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.15s ease;
        }
        .filter-bar button:hover, .filter-bar button.active {
            border-color: var(--accent);
            color: var(--accent);
        }
        .filter-bar button.active {
            background: var(--accent);
            color: white;
        }
        .media-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo-space">
                <img src="../images/extantralogo-inverted.webp" alt="Logo" class="logo-image">
            </div>
        </header>

        <div class="main-container">
            <aside class="sidebar">
                <div class="categories-section">
                    <div class="category" onclick="goToPage('../index.html')">← Feed</div>
                    <div class="category active" onclick="goToPage('index.html')">nyquilcigarettes</div>
                    <div class="category" onclick="goToPage('travel.html')">Travel</div>
                    <div class="category" onclick="goToPage('photo-diary.html')">Photo Diary</div>
                    <div class="category" onclick="goToPage('mp3.html')">MP3</div>
                    <div class="category" onclick="goToPage('music-videos.html')">Music Videos</div>
                </div>
            </aside>

            <main class="content">
                <div class="content-header">
                    <h1>nyquilcigarettes</h1>
                    <p class="tagline"> </p>
                </div>

                <div class="filter-bar" id="filterBar">
                    <button class="active" data-type="all">All</button>
                    <button data-type="post">Posts</button>
                    <button data-type="travel">Travel</button>
                    <button data-type="photo">Photos</button>
                    <button data-type="audio">MP3</button>
                    <button data-type="music-video">Music Videos</button>
                </div>

                <div class="blog-grid" id="mediaGrid">
                    <!-- Media entities loaded dynamically -->
                </div>
            </main>
        </div>

        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2026 nyquilcigarettes. All rights reserved.</p>
                <div class="footer-links">
                    <a href="../index.html">Feed</a>
                </div>
            </div>
        </footer>
    </div>

    <script>
        function goToPage(page) { window.location.href = page; }

        let allEntities = [];
        let activeType = 'all';

        function getEntityUrl(entity) {
            if (entity.type === 'post') return `post.html?slug=${entity.slug}`;
            if (entity.type === 'travel') return `travel.html#${entity.id}`;
            if (entity.type === 'photo') return `photo-diary.html#${entity.id}`;
            if (entity.type === 'audio') return `mp3.html#${entity.id}`;
            if (entity.type === 'music-video') return `music-videos.html#${entity.id}`;
            return '#';
        }

        function renderEntities(entities) {
            const grid = document.getElementById('mediaGrid');
            const filtered = activeType === 'all' ? entities : entities.filter(e => e.type === activeType);

            if (filtered.length === 0) {
                grid.innerHTML = '<div style="text-align:center;padding:40px 20px;color:#666;">No content yet.</div>';
                return;
            }

            grid.innerHTML = '';
            filtered.forEach(entity => {
                const formattedDate = new Date(entity.date).toLocaleDateString('en-US', {
                    year: 'numeric', month: 'long', day: 'numeric'
                });
                const card = document.createElement('article');
                card.className = 'blog-post-card';

                const thumb = entity.thumbnail
                    ? `<div style="margin-bottom:8px;"><img src="${entity.thumbnail}" style="width:100%;max-height:80px;object-fit:cover;" loading="lazy"></div>`
                    : '';

                card.innerHTML = `
                    <a class="media-card-link" href="${getEntityUrl(entity)}">
                        ${thumb}
                        <div class="post-date">
                            <span class="type-badge">${entity.type}</span>${formattedDate}
                        </div>
                        <h2 class="post-title">${entity.title}</h2>
                        ${entity.excerpt ? `<div class="post-excerpt">${entity.excerpt}</div>` : ''}
                        ${entity.tags && entity.tags.length > 0 ? `
                            <div class="post-tags">
                                ${entity.tags.filter(Boolean).map(t => `<span class="tag">${t}</span>`).join('')}
                            </div>` : ''}
                    </a>
                `;
                grid.appendChild(card);
            });
        }

        async function loadMedia() {
            try {
                const ts = new Date().getTime();
                const res = await fetch(`./media-database.json?v=${ts}`);
                if (!res.ok) throw new Error('Failed to load');
                const db = await res.json();
                allEntities = db.entities.filter(e => e.status === 'published')
                    .sort((a, b) => new Date(b.date) - new Date(a.date));
                renderEntities(allEntities);
            } catch (err) {
                console.error(err);
                document.getElementById('mediaGrid').innerHTML =
                    '<div style="text-align:center;padding:40px 20px;color:#666;">No content yet.</div>';
            }
        }

        document.getElementById('filterBar').addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (!btn) return;
            document.querySelectorAll('.filter-bar button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeType = btn.dataset.type;
            renderEntities(allEntities);
        });

        document.addEventListener('DOMContentLoaded', loadMedia);
    </script>
</body>
</html>
