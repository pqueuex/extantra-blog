<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Videos - nyquilcigarettes</title>
    <meta name="description" content="Music videos by nyquilcigarettes.">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <link rel="icon" type="image/webp" href="../images/extantralogo-inverted.webp">
    <link rel="stylesheet" href="../styles.css">
    <style>
        :root {
            --accent: #1a3a8a;
            --accent-dark: #0d1a50;
            --accent-darker: #102266;
            --accent-dim: #071130;
            --accent-hover: #0f1f45;
            --accent-dimmer: #050b1c;
            --accent-glow: rgba(26, 58, 138, 0.3);
        }
        .empty-state { text-align: center; padding: 60px 20px; color: #444; }
        .empty-state h2 { color: var(--accent); font-size: 16px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo-space">
                <img src="../images/extantralogo-inverted.webp" alt="Logo" class="logo-image">
            </div>
        </header>

        <div class="main-container">
            <aside class="sidebar">
                <div class="categories-section">
                    <div class="category" onclick="goToPage('../index.html')">← Feed</div>
                    <div class="category" onclick="goToPage('index.html')">nyquilcigarettes</div>
                    <div class="category" onclick="goToPage('travel.html')">Travel</div>
                    <div class="category" onclick="goToPage('photo-diary.html')">Photo Diary</div>
                    <div class="category" onclick="goToPage('mp3.html')">MP3</div>
                    <div class="category active" onclick="goToPage('music-videos.html')">Music Videos</div>
                </div>
            </aside>

            <main class="content">
                <div class="content-header">
                    <h1>Music Videos</h1>
                </div>

                <div class="video-section">
                    <video id="mainVideo" class="main-video" controls preload="metadata">
                        <source src="" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    <div class="video-controls">
                        <div class="video-title" id="currentVideoTitle">Select a video</div>
                    </div>
                </div>

                <div class="video-list" id="videoList"></div>
            </main>
        </div>

        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2026 nyquilcigarettes. All rights reserved.</p>
                <div class="footer-links"><a href="../index.html">Feed</a></div>
            </div>
        </footer>
    </div>

    <script>
        function goToPage(page) { window.location.href = page; }

        let videoDatabase = [];
        let currentIndex = 0;

        async function init() {
            try {
                const res = await fetch('./media-database.json');
                const db = await res.json();
                videoDatabase = db.entities
                    .filter(e => e.type === 'music-video' && e.status === 'published')
                    .sort((a, b) => new Date(b.date) - new Date(a.date));
                populateList();
                if (videoDatabase.length > 0) loadVideo(0);
            } catch (err) {
                console.error(err);
                document.getElementById('videoList').innerHTML =
                    `<div class="empty-state"><h2>No music videos yet</h2></div>`;
            }
        }

        function populateList() {
            const list = document.getElementById('videoList');
            if (videoDatabase.length === 0) {
                list.innerHTML = `<div class="empty-state"><h2>No music videos yet</h2><p>Check back soon.</p></div>`;
                return;
            }
            list.innerHTML = '';
            videoDatabase.forEach((video, i) => {
                const item = document.createElement('div');
                item.className = 'video-item';
                item.onclick = () => loadVideo(i);
                item.innerHTML = `
                    <div class="video-item-title">${video.title}</div>
                    <div class="video-item-meta">${video.date}</div>`;
                list.appendChild(item);
            });
        }

        function loadVideo(i) {
            if (i < 0 || i >= videoDatabase.length) return;
            currentIndex = i;
            const video = videoDatabase[i];
            const el = document.getElementById('mainVideo');
            el.src = video.mediaUrl;
            document.getElementById('currentVideoTitle').textContent = video.title;
            document.querySelectorAll('.video-item').forEach((item, idx) => item.classList.toggle('active', idx === i));
            el.load();
            el.play().catch(() => {});
        }

        document.getElementById('mainVideo').addEventListener('ended', () => {
            if (currentIndex < videoDatabase.length - 1) loadVideo(currentIndex + 1);
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
