<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel - nyquilcigarettes</title>
    <meta name="description" content="Travel diary by nyquilcigarettes.">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <link rel="icon" type="image/webp" href="../images/extantralogo-inverted.webp">
    <link rel="stylesheet" href="../styles.css">
    <style>
        :root {
            --accent: #1a3a8a;
            --accent-dark: #0d1a50;
            --accent-darker: #102266;
            --accent-dim: #071130;
            --accent-hover: #0f1f45;
            --accent-dimmer: #050b1c;
            --accent-glow: rgba(26, 58, 138, 0.3);
        }
        .travel-card {
            border: 1px solid var(--accent);
            padding: 16px;
            background: linear-gradient(to top, black 0%, var(--accent-dim) 100%);
            margin-bottom: 16px;
            transition: all 0.2s ease;
        }
        .travel-card:hover { background: linear-gradient(to top, black 0%, var(--accent-hover) 100%); }
        .travel-card h2 { font-size: 14px; color: white; margin-bottom: 8px; }
        .travel-card .travel-meta { font-size: 10px; color: #888; margin-bottom: 8px; }
        .travel-card .travel-excerpt { font-size: 11px; color: #ccc; line-height: 1.5; }
        .travel-card .travel-location { color: var(--accent); font-size: 10px; margin-top: 8px; }
        .entry-tags { margin-top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
        .empty-state { text-align: center; padding: 60px 20px; color: #444; }
        .empty-state h2 { color: var(--accent); font-size: 16px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo-space">
                <img src="../images/extantralogo-inverted.webp" alt="Logo" class="logo-image">
            </div>
        </header>

        <div class="main-container">
            <aside class="sidebar">
                <div class="categories-section">
                    <div class="category" onclick="goToPage('../index.html')">← Feed</div>
                    <div class="category" onclick="goToPage('index.html')">nyquilcigarettes</div>
                    <div class="category active" onclick="goToPage('travel.html')">Travel</div>
                    <div class="category" onclick="goToPage('photo-diary.html')">Photo Diary</div>
                    <div class="category" onclick="goToPage('mp3.html')">MP3</div>
                    <div class="category" onclick="goToPage('music-videos.html')">Music Videos</div>
                </div>
            </aside>

            <main class="content">
                <div class="content-header">
                    <h1>Travel</h1>
                </div>
                <div id="travelFeed"></div>
            </main>
        </div>

        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2026 nyquilcigarettes. All rights reserved.</p>
                <div class="footer-links"><a href="../index.html">Feed</a></div>
            </div>
        </footer>
    </div>

    <script>
        function goToPage(page) { window.location.href = page; }

        async function loadTravel() {
            const feed = document.getElementById('travelFeed');
            try {
                const ts = new Date().getTime();
                const res = await fetch(`./media-database.json?v=${ts}`);
                if (!res.ok) throw new Error('Failed');
                const db = await res.json();
                const entries = db.entities
                    .filter(e => e.type === 'travel' && e.status === 'published')
                    .sort((a, b) => new Date(b.date) - new Date(a.date));

                if (entries.length === 0) {
                    feed.innerHTML = `<div class="empty-state"><h2>No travel entries yet</h2><p>Check back soon.</p></div>`;
                    return;
                }

                feed.innerHTML = '';
                entries.forEach(entry => {
                    const formattedDate = new Date(entry.date).toLocaleDateString('en-US', {
                        year: 'numeric', month: 'long', day: 'numeric'
                    });
                    const location = entry.metadata && entry.metadata.location ? entry.metadata.location : '';
                    const div = document.createElement('div');
                    div.className = 'travel-card';
                    div.id = `entry-${entry.id}`;
                    div.innerHTML = `
                        <h2>${entry.title}</h2>
                        <div class="travel-meta">${formattedDate}</div>
                        ${entry.excerpt ? `<div class="travel-excerpt">${entry.excerpt}</div>` : ''}
                        ${entry.content ? `<div class="travel-excerpt" style="margin-top:12px;">${entry.content}</div>` : ''}
                        ${location ? `<div class="travel-location">📍 ${location}</div>` : ''}
                        ${entry.tags && entry.tags.length > 0 ? `
                            <div class="entry-tags">
                                ${entry.tags.filter(Boolean).map(t => `<span class="tag">${t}</span>`).join('')}
                            </div>` : ''}
                    `;
                    feed.appendChild(div);
                });
            } catch (err) {
                console.error(err);
                feed.innerHTML = `<div class="empty-state"><h2>No travel entries yet</h2></div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadTravel);
    </script>
</body>
</html>
