<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading... - EXTANTRA</title>
    <meta name="description" content="Blog post by tedwordnelson (EXTANTRA)">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <link rel="icon" type="image/webp" href="../images/extantralogo-inverted.webp">
    <link rel="stylesheet" href="../styles.css">
    <style>
        :root {
            --accent: #cc0000;
            --accent-dark: #aa0000;
            --accent-darker: #990000;
            --accent-dim: #330000;
            --accent-hover: #440000;
            --accent-dimmer: #220000;
            --accent-glow: rgba(204, 0, 0, 0.3);
        }
        .post-content { margin-top: 20px; line-height: 1.6; }
        .post-content p { margin-bottom: 16px; color: #cccccc; font-size: 12px; }
        .post-content h2 { color: var(--accent); font-size: 16px; margin: 24px 0 12px 0; border-bottom: 1px solid var(--accent); padding-bottom: 4px; }
        .post-content h3 { color: var(--accent); font-size: 14px; margin: 20px 0 10px 0; }
        .post-content h4 { color: white; font-size: 12px; margin: 16px 0 8px 0; }
        .post-content code { background-color: #333; color: var(--accent); padding: 2px 4px; font-family: 'Courier New', monospace; font-size: 11px; }
        .post-content pre { background-color: #111; border: 1px solid #333; padding: 12px; overflow-x: auto; margin: 16px 0; }
        .post-content pre code { background: none; padding: 0; color: #ccc; }
        .post-content blockquote { border-left: 3px solid var(--accent); padding-left: 16px; margin: 16px 0; font-style: italic; color: #999; }
        .post-content a { color: var(--accent); text-decoration: none; }
        .post-content a:hover { text-decoration: underline; }
        .post-content ul, .post-content ol { margin: 16px 0 16px 20px; color: #cccccc; }
        .post-content li { margin-bottom: 8px; font-size: 12px; }
        .post-header { border-bottom: 1px solid var(--accent); padding-bottom: 16px; margin-bottom: 24px; }
        .post-meta { display: flex; align-items: center; gap: 16px; margin-top: 12px; font-size: 10px; color: #666; }
        .post-meta .author { color: var(--accent); }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--accent); text-decoration: none; font-size: 12px; border: 1px solid var(--accent); padding: 6px 12px; transition: all 0.2s ease; }
        .back-link:hover { background-color: var(--accent); color: white; }
        .error-message { text-align: center; padding: 40px 20px; color: var(--accent); }
        .loading-message { text-align: center; padding: 40px 20px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo-space">
                <img src="../images/extantralogo-inverted.webp" alt="EXTANTRA Logo" class="logo-image">
            </div>
        </header>

        <div class="main-container">
            <aside class="sidebar">
                <div class="categories-section">
                    <div class="category" onclick="goToPage('../index.html')">← Feed</div>
                    <div class="category" onclick="goToPage('index.html')">tedwordnelson</div>
                    <div class="category" onclick="goToPage('photos.html')">Photos</div>
                    <div class="category" onclick="goToPage('3d-models.html')">3D Models</div>
                    <div class="category" onclick="goToPage('video.html')">Video</div>
                    <div class="category" onclick="goToPage('drawings.html')">Drawings</div>
                    <div class="category" onclick="goToPage('music.html')">Music</div>
                </div>
            </aside>

            <main class="content">
                <a href="index.html" class="back-link">← Back to Hub</a>
                <div id="postContainer">
                    <div class="loading-message">Loading post...</div>
                </div>
            </main>
        </div>

        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2026 EXTANTRA. All rights reserved.</p>
                <div class="footer-links">
                    <a href="mailto:contact@extantra.net">Contact</a>
                    <a href="https://store.extantra.net">Store</a>
                </div>
            </div>
        </footer>
    </div>

    <script>
        function goToPage(page) { window.location.href = page; }

        function getSlugFromUrl() {
            return new URLSearchParams(window.location.search).get('slug');
        }

        function updatePageMeta(post) {
            document.title = `${post.title} - EXTANTRA`;
            const desc = post.excerpt || (post.content || '').substring(0, 150) + '...';
            document.querySelector('meta[name="description"]').content = desc;
        }

        function renderPost(post) {
            const container = document.getElementById('postContainer');
            const formattedDate = new Date(post.date).toLocaleDateString('en-US', {
                year: 'numeric', month: 'long', day: 'numeric'
            });
            container.innerHTML = `
                <article class="blog-post">
                    <div class="post-header">
                        <h1 class="post-title">${post.title}</h1>
                        <div class="post-meta">
                            <span class="date">${formattedDate}</span>
                            <span class="author">by ${post.author}</span>
                            ${post.tags && post.tags.length > 0 ? `
                                <div class="post-tags">
                                    ${post.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                                </div>` : ''}
                        </div>
                    </div>
                    <div class="post-content">${post.content || ''}</div>
                </article>
            `;
        }

        async function loadPost() {
            const slug = getSlugFromUrl();
            if (!slug) {
                document.getElementById('postContainer').innerHTML = `
                    <div class="error-message"><h2>Post not found</h2>
                    <p>No post specified. <a href="index.html">Return to hub</a></p></div>`;
                return;
            }
            try {
                const ts = new Date().getTime();
                const res = await fetch(`./media-database.json?v=${ts}`);
                if (!res.ok) throw new Error('Could not load database');
                const db = await res.json();
                const post = db.entities.find(e => e.slug === slug && e.status === 'published' && e.type === 'post');
                if (!post) {
                    document.getElementById('postContainer').innerHTML = `
                        <div class="error-message"><h2>Post not found</h2>
                        <p>The requested post could not be found. <a href="index.html">Return to hub</a></p></div>`;
                    return;
                }
                updatePageMeta(post);
                renderPost(post);
            } catch (err) {
                console.error(err);
                document.getElementById('postContainer').innerHTML = `
                    <div class="error-message"><h2>Error loading post</h2>
                    <p>There was an error loading the post. <a href="index.html">Return to hub</a></p></div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadPost);
    </script>
</body>
</html>
