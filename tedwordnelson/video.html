<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video - EXTANTRA | Video Production & Digital Media</title>
    <meta name="description" content="Video productions and digital media by tedwordnelson (EXTANTRA).">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <link rel="icon" type="image/webp" href="../images/extantralogo-inverted.webp">
    <link rel="stylesheet" href="../styles.css">
    <style>
        :root {
            --accent: #cc0000;
            --accent-dark: #aa0000;
            --accent-darker: #990000;
            --accent-dim: #330000;
            --accent-hover: #440000;
            --accent-dimmer: #220000;
            --accent-glow: rgba(204, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo-space">
                <img src="../images/extantralogo-inverted.webp" alt="EXTANTRA Logo" class="logo-image">
            </div>
        </header>

        <div class="main-container">
            <aside class="sidebar">
                <div class="categories-section">
                    <div class="category" onclick="goToPage('../index.html')">← Feed</div>
                    <div class="category" onclick="goToPage('index.html')">tedwordnelson</div>
                    <div class="category" onclick="goToPage('photos.html')">Photos</div>
                    <div class="category" onclick="goToPage('3d-models.html')">3D Models</div>
                    <div class="category active" onclick="goToPage('video.html')">Video</div>
                    <div class="category" onclick="goToPage('drawings.html')">Drawings</div>
                    <div class="category" onclick="goToPage('music.html')">Music</div>
                </div>
            </aside>

            <main class="content">
                <div class="content-header">
                    <h1>Video</h1>
                </div>

                <div class="video-section">
                    <video id="mainVideo" class="main-video" controls preload="metadata">
                        <source src="" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    <div class="video-controls">
                        <div class="video-title" id="currentVideoTitle">Select a video</div>
                        <div class="video-buttons">
                            <button id="autoplayBtn" class="video-btn active">Auto</button>
                            <button id="shuffleBtn" class="video-btn">Shuffle</button>
                        </div>
                    </div>
                </div>

                <div class="video-list" id="videoList"></div>
            </main>
        </div>

        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2026 EXTANTRA. All rights reserved.</p>
                <div class="footer-links">
                    <a href="mailto:contact@extantra.net">Contact</a>
                    <a href="https://store.extantra.net">Store</a>
                </div>
            </div>
        </footer>
    </div>

    <script>
        function goToPage(page) { window.location.href = page; }

        let videoDatabase = [];
        let currentVideoIndex = 0;
        let isAutoplay = true;
        let isShuffled = false;
        let shuffledIndices = [];

        async function initializeVideoPlayer() {
            try {
                const res = await fetch('./media-database.json');
                const db = await res.json();
                videoDatabase = db.entities
                    .filter(e => e.type === 'video' && e.status === 'published')
                    .sort((a, b) => new Date(b.date) - new Date(a.date));
                populateVideoList();
                if (videoDatabase.length > 0) loadVideo(0);
                setupEventListeners();
            } catch (err) {
                console.error('Error loading video database:', err);
                document.getElementById('videoList').innerHTML = '<div class="error-message">Unable to load video database.</div>';
            }
        }

        function populateVideoList() {
            const videoList = document.getElementById('videoList');
            videoList.innerHTML = '';
            videoDatabase.forEach((video, index) => {
                const item = document.createElement('div');
                item.className = 'video-item';
                item.onclick = () => loadVideo(index);
                item.innerHTML = `
                    <div class="video-item-title">${video.title}</div>
                    <div class="video-item-meta">${video.date} • ${(video.metadata && video.metadata.duration_formatted) || ''}</div>
                `;
                videoList.appendChild(item);
            });
        }

        function loadVideo(index) {
            if (index < 0 || index >= videoDatabase.length) return;
            currentVideoIndex = index;
            const video = videoDatabase[index];
            const mainVideo = document.getElementById('mainVideo');
            mainVideo.src = video.mediaUrl;
            document.getElementById('currentVideoTitle').textContent = video.title;
            updateVideoListActiveState(index);
            mainVideo.load();
            if (isAutoplay && index > 0) mainVideo.play().catch(() => {});
        }

        function updateVideoListActiveState(activeIndex) {
            document.querySelectorAll('.video-item').forEach((item, i) => {
                item.classList.toggle('active', i === activeIndex);
            });
        }

        function playNext() {
            let nextIndex;
            if (isShuffled) {
                const ci = shuffledIndices.indexOf(currentVideoIndex);
                nextIndex = shuffledIndices[(ci + 1) % shuffledIndices.length];
            } else {
                nextIndex = (currentVideoIndex + 1) % videoDatabase.length;
            }
            loadVideo(nextIndex);
        }

        function setupEventListeners() {
            const mainVideo = document.getElementById('mainVideo');
            mainVideo.addEventListener('ended', () => { if (isAutoplay) playNext(); });
            mainVideo.addEventListener('error', () => { if (isAutoplay) setTimeout(playNext, 1000); });

            document.getElementById('shuffleBtn').addEventListener('click', () => {
                isShuffled = !isShuffled;
                document.getElementById('shuffleBtn').classList.toggle('active', isShuffled);
                if (isShuffled) {
                    shuffledIndices = [...Array(videoDatabase.length).keys()];
                    for (let i = shuffledIndices.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [shuffledIndices[i], shuffledIndices[j]] = [shuffledIndices[j], shuffledIndices[i]];
                    }
                }
            });

            document.getElementById('autoplayBtn').addEventListener('click', () => {
                isAutoplay = !isAutoplay;
                document.getElementById('autoplayBtn').classList.toggle('active', isAutoplay);
            });

            document.addEventListener('keydown', e => {
                switch (e.key) {
                    case ' ':
                        e.preventDefault();
                        mainVideo.paused ? mainVideo.play() : mainVideo.pause();
                        break;
                    case 'ArrowRight':
                        if (e.ctrlKey || e.metaKey) { e.preventDefault(); playNext(); }
                        break;
                }
            });
        }

        document.addEventListener('DOMContentLoaded', initializeVideoPlayer);
    </script>
</body>
</html>
